<html>
  <head>
    <title>Stream</title>
    <script src="https://cdn.jsdelivr.net/hls.js/latest/hls.min.js"></script>
  </head>
  <body>
    <video id="video" controls></video>
    <script>
function playVideo() {
  console.log('Playing video')
  var video = document.getElementById('video');
  var hls = new Hls({
    liveMaxLatencyDurationCount: 5,
    liveSyncDurationCount: 2,
    manifestLoadingMaxRetry: 10,
  });
  hls.loadSource('screen/stream.m3u8');
  hls.attachMedia(video);
  hls.on(Hls.Events.ERROR, function (event, data) {
    if (data.fatal) {
      switch (data.type) {
        case Hls.ErrorTypes.MEDIA_ERROR:
          console.log('fatal media error encountered, try to recover');
          hls.recoverMediaError();
          break;
        case Hls.ErrorTypes.NETWORK_ERROR:
          console.error('fatal network error encountered, retrying', data);
          hls.startLoad();
          break;
        default:
          hls.destroy();
          break;
      }
    }
  });
  hls.on(Hls.Events.MANIFEST_PARSED,function() {
    video.play();
  });
}

function sleep(milliseconds) {
  return new Promise((resolve) => setTimeout(resolve, milliseconds));
}

async function waitForPlaylist() {
  for (let attempt = 0; attempt < 60; attempt++) {
    try {
      const response = await fetch('screen/stream.m3u8', {cache: 'no-store'});
      const playlist = await response.text();
      if (response.ok && playlist.includes('#EXTINF')) {
        return;
      }
    } catch (error) {
      console.log('Waiting for stream playlist', error);
    }
    await sleep(1000);
  }
  throw new Error('Stream playlist did not become ready');
}

async function main() {
  if(Hls.isSupported()) {
    await waitForPlaylist();
    playVideo();
  }
}

main()
    </script>
  </body>
</html>
